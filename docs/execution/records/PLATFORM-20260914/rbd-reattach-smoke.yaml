apiVersion: v1
kind: Pod
metadata:
  name: rbd-reader
  namespace: platform-smoke
spec:
  nodeSelector:
    kubernetes.io/hostname: ani-03
  containers:
  - name: probe
    image: docker.changqingyun.cn/kubercloud/kc-networking:v0.6.2
    imagePullPolicy: IfNotPresent
    command:
    - /bin/sh
    - -c
    - sleep 86400
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: rbd
