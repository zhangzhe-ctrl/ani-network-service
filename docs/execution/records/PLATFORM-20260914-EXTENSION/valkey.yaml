apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: iam-test-infra
spec:
  ports:
  - name: client
    port: 6379
    targetPort: 6379
  selector:
    app: valkey
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: iam-test-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  serviceName: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
      - command:
        - sh
        - -ec
        - exec valkey-server --appendonly yes --appendfsync everysec --requirepass
          "$VALKEY_PASSWORD" --maxmemory 256mb --maxmemory-policy noeviction
        env:
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: valkey-auth
              key: password
        image: docker.io/valkey/valkey:8.1.10-alpine
        imagePullPolicy: IfNotPresent
        name: valkey
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          tcpSocket:
            port: 6379
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - mountPath: /data
          name: data
      volumes: []
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
      storageClassName: rook-ceph-block
