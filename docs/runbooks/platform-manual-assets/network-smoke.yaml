apiVersion: v1
kind: Namespace
metadata:
  name: platform-smoke
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: network-probe
  namespace: platform-smoke
spec:
  selector:
    matchLabels:
      app: network-probe
  template:
    metadata:
      labels:
        app: network-probe
    spec:
      containers:
      - name: probe
        image: docker.changqingyun.cn/kubercloud/kc-networking:v0.6.2
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - sleep 86400
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
