apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rbd
  namespace: platform-smoke
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cephfs
  namespace: platform-smoke
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: rook-cephfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: rbd-writer
  namespace: platform-smoke
spec:
  nodeSelector:
    kubernetes.io/hostname: ani-01
  containers:
  - name: probe
    image: docker.changqingyun.cn/kubercloud/kc-networking:v0.6.2
    imagePullPolicy: IfNotPresent
    command:
    - /bin/sh
    - -c
    - sleep 86400
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: rbd
---
apiVersion: v1
kind: Pod
metadata:
  name: fs-writer
  namespace: platform-smoke
spec:
  nodeSelector:
    kubernetes.io/hostname: ani-01
  containers:
  - name: probe
    image: docker.changqingyun.cn/kubercloud/kc-networking:v0.6.2
    imagePullPolicy: IfNotPresent
    command:
    - /bin/sh
    - -c
    - sleep 86400
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: cephfs
---
apiVersion: v1
kind: Pod
metadata:
  name: fs-reader
  namespace: platform-smoke
spec:
  nodeSelector:
    kubernetes.io/hostname: ani-02
  containers:
  - name: probe
    image: docker.changqingyun.cn/kubercloud/kc-networking:v0.6.2
    imagePullPolicy: IfNotPresent
    command:
    - /bin/sh
    - -c
    - sleep 86400
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: cephfs
