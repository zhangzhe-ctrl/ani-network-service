syntax = "proto3";

package conf.v1;

option go_package = "github.com/zhangzhe-ctrl/ani-network-service/internal/conf/v1;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Network network = 2;
}

message Network {
  string database_dsn = 1;
  // Empty uses Kubernetes in-cluster service account credentials.
  string kubeconfig = 2;
  string cluster_id = 3;
  string namespace_prefix = 4;
  // Base64 encoded secret, at least 32 bytes, shared by service replicas.
  string cursor_signing_key = 5;
  Worker worker = 6;
}

message Worker {
  google.protobuf.Duration lease = 1;
  google.protobuf.Duration request_timeout = 2;
  google.protobuf.Duration observe_every = 3;
  google.protobuf.Duration stale_after = 4;
  google.protobuf.Duration retry_min = 5;
  google.protobuf.Duration retry_max = 6;
  google.protobuf.Duration poll_interval = 7;
}

message Server {
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }

  message Admin {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }

  GRPC grpc = 1;
  Admin admin = 2;
  google.protobuf.Duration shutdown_timeout = 3;
}
