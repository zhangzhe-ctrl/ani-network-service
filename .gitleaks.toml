# NET-05A captured metadata contains public resource IDs, idempotency keys
# and Kubernetes Secret names. These are not Secret data or credentials.
# Keep default rules; the exception requires this evidence path AND an exact
# reviewed JSON property/value line. No directory-wide or rule-wide exclusion.
[extend]
useDefault = true

[[allowlists]]
description = "Exact reviewed NET-05A fixture metadata, preserving original evidence hashes"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^docs/execution/records/NET-05A/live/.*\.json$''']
regexTarget = "line"
regexes = [
  '''^\s*"ani\.kubercloud\.io/workload\-identity\-secret": "(?:ani\-wi\-18a3c4e1\-baf3\-40d5\-86be|ani\-wi\-2f003a7b\-da6c\-4658\-a482|ani\-wi\-2f50d8d9\-1ff4\-4615\-91c8|ani\-wi\-3ab51187\-c358\-46d5\-9985|ani\-wi\-3dd7b3f8\-e8db\-41d6\-b4cd|ani\-wi\-45852c96\-6e7f\-427d\-bed9|ani\-wi\-61096668\-259e\-47d0\-a65a|ani\-wi\-6c0779c5\-59d2\-47ae\-95c8|ani\-wi\-ae22a1aa\-04fc\-40e5\-a881|ani\-wi\-b380e5ec\-f76a\-484c\-984f)",?\s*$''',
