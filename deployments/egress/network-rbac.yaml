# Template: use the Network deployment's existing ServiceAccount and namespace.
# No real NIC is adopted by applying this RBAC; the admin API is a separate step.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ani-network-egress
rules:
  - apiGroups: [networking.kubercloud.com]
    resources: [vpcs, subnets, eips, snats, eipgateways, vlannetworks]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [networking.kubercloud.com]
    resources: [snats]
    verbs: [patch]
  - apiGroups: [networking.kubercloud.com]
    resources: [nats, vnics, vnicips]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes, pods, services, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, create]
  - apiGroups: [networking.k8s.io]
    resources: [servicecidrs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ani-network-egress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ani-network-egress
subjects:
  - kind: ServiceAccount
    name: ani-network-service
    namespace: ani-network-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ani-network-device-adoption
  namespace: kcn-system
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [kcn-config]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ani-network-device-adoption
  namespace: kcn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ani-network-device-adoption
subjects:
  - kind: ServiceAccount
    name: ani-network-service
    namespace: ani-network-system
