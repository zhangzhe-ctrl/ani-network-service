# Resource definitions only. This file deliberately declares no binding: the
# subject depends on the deployment, and a binding hardcoded to a placeholder
# namespace silently fails (the ServiceAccount it names never exists). Bind this
# ClusterRole, and the Role below, from the deployment's own manifest -- see
# ../ani-system/networking-rbac.yaml for a worked example.
# No real NIC is adopted by applying this RBAC; the admin API is a separate step.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ani-network-egress
rules:
  - apiGroups: [networking.kubercloud.com]
    resources: [vpcs, subnets, eips, snats, eipgateways, vlannetworks]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [networking.kubercloud.com]
    resources: [snats]
    verbs: [patch]
  - apiGroups: [networking.kubercloud.com]
    resources: [nats, vnics, vnicips]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes, pods, services, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, create]
  - apiGroups: [networking.k8s.io]
    resources: [servicecidrs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ani-network-device-adoption
  namespace: kcn-system
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [kcn-config]
    verbs: [get, patch]
